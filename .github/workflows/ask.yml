name: Ask my agent

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  answer:
    # Issue forms apply the label; the title prefix is a fallback if the label is missing.
    if: contains(github.event.issue.labels.*.name, 'ask') || startsWith(github.event.issue.title, '[ask]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ask-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The issue itself is read from the event payload inside the script —
      # never interpolated into a shell command.
      - run: node agent/answer.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
